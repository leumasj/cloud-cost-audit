      <!-- Google Analytics — deferred to avoid blocking LCP -->
<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-BRXYEY5FPP';
      s.async = true;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BRXYEY5FPP', { 'send_page_view': true });
    }, 3000);
  });
</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Google Fonts: preconnect first, then non-blocking load ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" />
    </noscript>

    <!-- ── Favicon & PWA icons ── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#080810" />
    <meta name="msapplication-TileColor" content="#080810" />

    <!-- ── SEO meta ── -->
    <title>KloudAudit — Free Cloud Cost Audit for AWS, GCP &amp; Azure</title>
    <meta name="description" content="Free cloud cost audit — 18 checkpoints across AWS, GCP and Azure. Find 20–45% savings in 15 minutes. No credentials, no agents, no procurement process required." />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.kloudaudit.eu/" />
    <meta property="og:title" content="KloudAudit — Free Cloud Cost Audit for AWS, GCP &amp; Azure" />
    <meta property="og:description" content="Free cloud cost audit — 18 checkpoints. Find 20–45% savings in 15 minutes. No AWS credentials or procurement required." />
    <meta property="og:image" content="https://kloudaudit.eu/android-chrome-512x512.png" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KloudAudit — Free Cloud Cost Audit for AWS, GCP &amp; Azure" />
    <meta name="twitter:description" content="Free cloud cost audit. Average saving: 20-45%." />
    <meta name="twitter:image" content="https://kloudaudit.eu/android-chrome-512x512.png" />

    <!-- ── Critical CSS: paint background before JS loads ── -->
    <style>
      html, body { margin: 0; padding: 0; background: #080810; color: #e2e8f0; }
      #root { min-height: 100vh; }
      .seo-h1 { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      /* ── LCP overlay: painted from HTML before JS loads ── */
      #lcp-overlay {
        position: fixed; inset: 0; background: #080810; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        transition: opacity 0.2s ease;
      }
      #lcp-overlay.fade { opacity: 0; pointer-events: none; }
      #lcp-overlay h1 {
        font-family: 'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: clamp(42px, 6.5vw, 82px);
        font-weight: 800; line-height: 1.0; letter-spacing: -3px;
        color: #fff; margin: 0;
      }
      #lcp-overlay .lcp-grad {
        background: linear-gradient(135deg, #00ffb4 0%, #00d4ff 60%, #818cf8 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>
  </head>
  <body>
    <h1 class="seo-h1">KloudAudit — Free Cloud Cost Audit for AWS, GCP and Azure. Find 20–45% Savings in 15 Minutes. No Account Access Required.</h1>
    <!-- LCP hero: browser paints this from HTML before JS loads. React removes it after mount. -->
    <div id="lcp-overlay" aria-hidden="true">
      <h1>The audit your<br><span class="lcp-grad">cloud provider</span><br>won't give you.</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
